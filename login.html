<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>心理辅导系统 - 登录</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh; /* 占满全屏 */
      display: flex;
      justify-content: center;
      align-items: center;

      /* 🌊 动态渐变背景 */
      background: linear-gradient(-45deg, #a18cd1, #fbc2eb, #a6c1ee, #96e6a1);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .login-box {
      width: 320px;
      text-align: center;
      padding: 40px;
      
      /* ✨ 毛玻璃效果 */
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
    }

    h2 { color: #4a5568; margin-bottom: 25px; }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd; /* 稍微加深边框 */
      border-radius: 8px;
      box-sizing: border-box; /* 防止宽度溢出 */
    }

    button {
      background: #2ecc71;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #27ae60; }

    a { color: #3498db; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .privacy-text {
      font-size: 12px; 
      color: #666; /* 深色一点以便在白色背景看清 */
      text-align: left; 
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2 id="title">心理辅导系统登录</h2>

    <select id="lang" onchange="changeLang()">
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="ms">Bahasa Melayu</option>
    </select>

    <select id="role">
      <option value="student">学生 Student</option>
      <option value="teacher">老师 Teacher</option>
    </select>

    <input type="text" id="username" placeholder="用户名 / Username">
    <input type="password" id="password" placeholder="密码 / Password">
    
    <p id="privacyText" class="privacy-text">
      🔒 您的所有信息均存储在本地浏览器中。
    </p>

    <button onclick="login()" id="loginBtn">登录 / Login</button>
    <p id="error" style="color: #e74c3c; font-size: 14px;"></p>
    <p id="registerLink" style="margin-top: 15px; font-size: 14px;">
      还没有帐号？<a href="register.html" id="registerText">点击这里注册</a>
    </p>
  </div>

  <script>
    const text = {
      zh: {
        title: "心理辅导系统登录", username: "用户名 / Username", password: "密码 / Password",
        login: "登录 / Login", noAccount: "还没有帐号？", register: "点击这里注册",
        privacy: "🔒 您的所有信息均存储在本地浏览器中。"
      },
      en: {
        title: "Counseling System Login", username: "Username", password: "Password",
        login: "Login", noAccount: "Don't have an account?", register: "Register here",
        privacy: "🔒 All your information is stored locally in your browser."
      },
      ms: {
        title: "Log Masuk Sistem Kaunseling", username: "Nama pengguna", password: "Kata laluan",
        login: "Log Masuk", noAccount: "Belum ada akaun?", register: "Daftar di sini",
        privacy: "🔒 Semua maklumat anda disimpan secara setempat dalam pelayar anda."
      }
    };

    function changeLang() {
      const lang = document.getElementById("lang").value;
      localStorage.setItem("lang", lang);
      const t = text[lang];
      document.getElementById("title").innerText = t.title;
      document.getElementById("username").placeholder = t.username;
      document.getElementById("password").placeholder = t.password;
      document.getElementById("loginBtn").innerText = t.login;
      document.getElementById("registerLink").innerHTML = `${t.noAccount} <a href="register.html" id="registerText">${t.register}</a>`;
      document.getElementById("privacyText").innerText = t.privacy;
    }

    function login() {
      const role = document.getElementById("role").value;
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();
      const error = document.getElementById("error");

      const obfuscatedPassword = btoa(pass);
      const users = JSON.parse(localStorage.getItem("users") || "[]");
      const found = users.find(u => u.username === user && u.password === obfuscatedPassword && u.role === role);

      if (found) {
        localStorage.setItem("loggedInUser", JSON.stringify(found));
        if (role === "student") {
          window.location.href = "index.html";
        } else {
          window.location.href = "teacher.html";
        }
      } else {
        error.innerText = "用户名或密码错误 / Incorrect username or password";
      }
    }

    const currentLang = localStorage.getItem("lang") || "zh";
    document.getElementById("lang").value = currentLang;
    changeLang();
  </script>
</body>
</html>
